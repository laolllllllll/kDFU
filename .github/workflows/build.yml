name: Build IPA (armv7)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode 13.2.1
        run: |
          sudo xcode-select -s /Applications/Xcode_13.4.1.app
          xcodebuild -version
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode Project
        run: xcodegen generate
      
      - name: Build armv7
        run: |
          xcodebuild -project kDFU.xcodeproj \
            -scheme kDFU \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/kDFU.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO ARCHS=armv7 VALID_ARCHS=armv7
      
      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -R build/kDFU.xcarchive/Products/Applications/kDFU.app build/Payload/
          cd build && zip -r ../kDFU-armv7.ipa Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kDFU-armv7.ipa
          path: kDFU-armv7.ipa
      
      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: kDFU-armv7.app
          path: build/kDFU.xcarchive/Products/Applications/kDFU.app
