name: kDFU
options:
  bundleIdPrefix: com.jjr
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    ARCHS: "arm64"
    VALID_ARCHS: "arm64"
    ONLY_ACTIVE_ARCH: "NO"
    SKIP_INSTALL: "NO"
    INSTALL_PATH: "/Applications"
targets:
  kDFU:
    type: application
    platform: iOS
    sources:
      - path: kdfu
        excludes:
          - "Assets.xcassets"
    resources:
      - path: kdfu/Assets.xcassets
      - path: kdfu/index.html
      - path: kdfu/KDFU
        type: folder
    info:
      path: kdfu/Info.plist
      properties:
        CFBundleDisplayName: kDFU
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjr.kdfu
        INFOPLIST_FILE: kdfu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "NO"
